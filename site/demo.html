<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000">
<title>B-CRR Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Noto+Sans+TC:wght@300;400;500&family=IBM+Plex+Mono:wght@400;500&family=Playfair+Display:wght@400&display=swap">
<style>
:root{ --gn:#5FD3A6; --or:#E5A34F; --rd:#E0564A;
  --ease:cubic-bezier(.22,1,.36,1);
  --out:cubic-bezier(.16,1,.3,1);        /* 收得很穩的減速 */
  --spring:cubic-bezier(.32,1.12,.5,1);  /* 末端帶一點回彈 */ }
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#000;color:#fff;
  font-family:"Noto Sans TC",-apple-system,BlinkMacSystemFont,sans-serif;
  font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden}

/* 分頁列 */
.topbar{position:fixed;top:0;left:0;right:0;z-index:70;display:flex;align-items:center;
  gap:1.4rem;padding:.7rem 22px;background:rgba(0,0,0,.8);backdrop-filter:blur(14px);
  border-bottom:1px solid #fff}
.topbar .brand{font-family:Archivo,sans-serif;font-weight:700;font-size:.95rem;
  letter-spacing:-.02em;margin-right:auto}
.topbar a{font-family:"IBM Plex Mono",monospace;font-size:.72rem;letter-spacing:.16em;
  text-transform:uppercase;color:#fff;text-decoration:none;opacity:.55;
  padding:.35rem .1rem;border-bottom:1px solid transparent;transition:.3s}
.topbar a:hover{opacity:1}
.topbar a.on{opacity:1;border-bottom-color:#fff}

/* ── 一鏡到底：蛻皮 → 推近 → 點亮 → 推到左邊講三個指標 ── */
#act{position:relative;height:2800svh}
.stage{position:sticky;top:0;height:100svh;display:grid;place-items:center;
  padding:4.6rem 22px 3rem;overflow:hidden}
#sv{overflow:visible;will-change:transform;
  width:min(94vw,72rem,calc((100svh - 10rem) * 1.418));height:auto}
#cam,#camImg{will-change:transform}
#sv .box,#sv .outl{fill:none;stroke:#fff;stroke-width:calc(1.6px * var(--k,1));
  stroke-linejoin:round}
#sv .axis{stroke:#fff;stroke-width:calc(.9px * var(--k,1));opacity:0}
#sv .halo{fill:url(#hg)}
#sv .glow{stroke:#fff;stroke-width:calc(6px * var(--k,1));stroke-linecap:round;
  filter:blur(9px);opacity:0}
#sv .beam{stroke:#fff;stroke-width:calc(2.6px * var(--k,1));stroke-linecap:round;
  filter:blur(3px);opacity:0}
#sv .seg{stroke:#fff;stroke-width:calc(1.2px * var(--k,1));stroke-linecap:round;opacity:0}
#sv text{font-family:"IBM Plex Mono",monospace;font-size:calc(13px * var(--k,1));
  font-weight:500;fill:#fff;paint-order:stroke;stroke:#000;
  stroke-width:calc(3px * var(--k,1));stroke-linejoin:round}

.mpanel{position:absolute;right:clamp(22px,5vw,4rem);top:7rem;bottom:4.5rem;
  width:min(42vw,34rem);display:flex;flex-direction:column;justify-content:space-between;
  align-items:flex-end;text-align:right;opacity:0;pointer-events:none}
.mname{font-family:Archivo,sans-serif;font-weight:700;letter-spacing:-.04em;
  font-size:clamp(3rem,9vw,7rem);line-height:.92}
.msub{font-size:.9rem;opacity:.65;margin-top:.3rem}
.mval{font-family:"IBM Plex Mono",monospace;font-size:clamp(1.4rem,3.4vw,2.4rem);
  letter-spacing:-.02em;margin-top:1.1rem}
.mform{font-family:"IBM Plex Mono",monospace;font-size:clamp(1rem,2.2vw,1.6rem);
  border-top:1px solid #fff;padding-top:1rem;width:100%}

/* ── 診斷書 ── */
.sheetwrap{position:relative;height:340svh}
.sheetStick{position:sticky;top:0;height:100svh;display:grid;place-items:center;
  padding:4.6rem 22px 2rem}
.sheet{width:min(96vw,84rem);border:1px solid #fff;background:#000;
  display:grid;grid-template-columns:15rem 1fr;
  /* 第二列一定要 minmax(0,1fr)，否則內容會把固定高度撐破再被裁掉 */
  grid-template-rows:auto minmax(0,1fr);
  height:min(46rem,calc(100svh - 6.4rem));overflow:hidden;
  transform-origin:center;will-change:transform,opacity}
/* 展開過程由捲動驅動，所以預設不下 transition；跑完才打開讓點選也有動畫 */
.sheet.done .bar,.sheet.done .arc{transition:transform .8s var(--out),
  stroke-dashoffset .9s var(--out)}
.sheet-hd{grid-column:1/-1;display:flex;align-items:center;gap:.8rem;
  padding:.85rem 1.2rem;border-bottom:1px solid #fff}
.sheet-hd b{font-family:Archivo,sans-serif;font-size:.92rem;font-weight:600}
.sheet-hd .who{font-family:"IBM Plex Mono",monospace;font-size:.74rem}
.sheet-hd .tag{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:.6rem;
  letter-spacing:.18em;border:1px solid #fff;padding:.12rem .6rem}

.files{border-right:1px solid #fff;padding:.8rem .7rem;display:flex;
  flex-direction:column;min-height:0;overflow-y:auto;scrollbar-width:thin}
.files h4{margin:.2rem .4rem .6rem;font-family:"IBM Plex Mono",monospace;font-size:.62rem;
  letter-spacing:.18em;text-transform:uppercase;font-weight:400;opacity:.6}
.fold>button{width:100%;display:flex;align-items:center;gap:.5rem;background:none;border:0;
  color:#fff;font:inherit;font-size:.8rem;text-align:left;padding:.4rem .45rem;cursor:pointer}
.fold>button:hover{background:#151515}
.fold .ar{font-family:monospace;font-size:.6rem;transition:transform .25s;opacity:.7}
.fold.open .ar{transform:rotate(90deg);opacity:1}
.fold .n{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:.66rem;opacity:.6}
.kids{display:none;padding:.1rem 0 .35rem .9rem;flex-direction:column}
.fold.open .kids{display:flex}
.kids button{background:none;border:0;border-left:1px solid transparent;color:#fff;
  font:inherit;font-size:.76rem;text-align:left;padding:.28rem .45rem;cursor:pointer;
  display:flex;gap:.5rem;opacity:.6}
.kids button:hover{opacity:1}
.kids button.on{opacity:1;border-left-color:#fff;background:#151515}
.kids button span{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:.68rem}

.body{display:grid;grid-template-columns:minmax(0,15rem) 1fr;gap:1.4rem;
  padding:1.3rem;min-height:0}
.toothbox{display:flex;flex-direction:column;justify-content:center;min-height:0}
.toothbox svg{width:100%;height:auto;max-height:100%;margin:0 auto}

.right{display:grid;grid-template-rows:auto minmax(0,1fr);gap:1.1rem;
  min-width:0;min-height:0}
.mrow{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid #fff}
.mrow div{padding:.85rem .95rem;border-right:1px solid #fff}
.mrow div:last-child{border-right:0}
.mrow b{display:block;font-family:"IBM Plex Mono",monospace;font-size:.64rem;
  letter-spacing:.14em;opacity:.6}
.mrow s{display:block;text-decoration:none;font-family:Archivo,sans-serif;
  font-size:clamp(1.2rem,2.4vw,1.75rem);font-weight:700;letter-spacing:-.02em;
  margin-top:.15rem;font-variant-numeric:tabular-nums}
.mrow em{font-style:normal;font-size:.7rem;opacity:.55}
.lower{display:grid;grid-template-rows:minmax(0,1fr) auto;gap:1.1rem;min-height:0}
.chart{border:1px solid #fff;padding:1rem;display:flex;min-height:0}
.chart svg{width:100%;flex:1;min-height:0}
.dials{display:flex;gap:1rem;justify-content:flex-end}
.dial{width:8.4rem;border:1px solid #fff;padding:.8rem;display:flex;
  flex-direction:column;align-items:center;gap:.4rem}
.dial svg{width:5.4rem;height:5.4rem}
.dial b{font-family:"IBM Plex Mono",monospace;font-size:.62rem;letter-spacing:.14em}

/* ── 準確度 ── */
.acc{position:relative;height:260svh}
.accStick{position:sticky;top:0;height:100svh;display:grid;place-items:center}
.accgrid{max-width:74rem;margin:0 auto;padding:0 22px;
  display:grid;grid-template-columns:repeat(4,1fr);gap:2rem}
.accgrid figure{margin:0;text-align:center}
.accgrid b{display:block;font-family:"Playfair Display",Georgia,serif;font-weight:400;
  font-size:clamp(2.6rem,7vw,5.4rem);line-height:1;color:#fff;
  font-variant-numeric:tabular-nums;will-change:opacity,transform}
.accgrid figcaption{margin-top:1rem;font-family:"IBM Plex Mono",monospace;font-size:.66rem;
  letter-spacing:.22em;text-transform:uppercase;opacity:.6}

/* ── CTA ── */
.cta{padding:clamp(4rem,9vw,7rem) 0 clamp(6rem,12vw,10rem);display:grid;place-items:center}
#goRun{font-family:Archivo,sans-serif;font-weight:700;letter-spacing:-.02em;
  font-size:clamp(1.5rem,4.2vw,2.8rem);color:#000;background:#fff;border:1px solid #fff;
  padding:.62em 1.25em;cursor:pointer;transition:.25s var(--ease)}
#goRun:hover{background:#000;color:#fff}

@media (max-width:1080px){.sheet{grid-template-columns:12rem 1fr}
  .body{grid-template-columns:minmax(0,11rem) 1fr}.dial{width:7rem}}
@media (max-width:860px){
  .mpanel{position:static;width:100%;align-items:flex-start;text-align:left}
  .sheet{grid-template-columns:1fr}
  .files{border-right:0;border-bottom:1px solid #fff}
  .body{grid-template-columns:1fr}
  .accgrid{grid-template-columns:repeat(2,1fr);gap:2.4rem}
}
</style>

<nav class="topbar">
  <div class="brand">B-CRR.</div>

</nav>

const TEETH = GEO.teeth.slice(0,1);          /* 只示範左邊那顆牙 */

const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const seg=(t,a,b)=>clamp((t-a)/(b-a),0,1);
const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
const N=t=>document.createElementNS("http://www.w3.org/2000/svg",t);
const pathOf=p=>"M "+p.map(q=>q.join(" ")).join(" L ")+" Z";
const at=(t,k)=>t.pts[k]||t.lv[k].p;

/* ═════ 一鏡到底 ═════
   蛻皮、推近、點亮、講指標全部在同一個 sticky、同一個 SVG 裡完成。
   分成兩個區塊的話，交界處會同時看到兩顆牙，那不叫銜接。 */
const sv=document.getElementById("sv"), mpanel=document.getElementById("mpanel");
const gBox=document.getElementById("gBox"), gTooth=document.getElementById("gTooth");
const boxes=document.getElementById("boxes"), outls=document.getElementById("outls");
const axes=document.getElementById("axes"), beams=document.getElementById("beams"),
      dots=document.getElementById("dots");
[gBox,gTooth].forEach(g=>{
  const r=N("rect"); r.setAttribute("width",787); r.setAttribute("height",555);
  r.setAttribute("fill","#000"); g.appendChild(r);
});

const ORDER=[["C","D"],["A","B"],["J","L","G"],["K"],["E","F"],["Q","S","R"]];
const dotEls={}, T0=TEETH[0];

TEETH.forEach(t=>{
  const q=N("polygon"); q.setAttribute("points",t.obb.map(p=>p.join(",")).join(" "));
  q.setAttribute("fill","#fff"); gBox.appendChild(q);
  const m=N("path"); m.setAttribute("d",pathOf(t.poly)); m.setAttribute("fill","#fff");
  gTooth.appendChild(m);

  const b=N("polygon"); b.setAttribute("points",t.obb.map(p=>p.join(",")).join(" "));
  b.setAttribute("class","box"); boxes.appendChild(b);
  const o=N("path"); o.setAttribute("d",pathOf(t.poly)); o.setAttribute("class","outl");
  outls.appendChild(o);
  const ax=N("line"); ax.setAttribute("x1",t.axis[0][0]); ax.setAttribute("y1",t.axis[0][1]);
  ax.setAttribute("x2",t.axis[1][0]); ax.setAttribute("y2",t.axis[1][1]);
  ax.setAttribute("class","axis"); axes.appendChild(ax);

  ORDER.flat().forEach(k=>{
    const [x,y]=at(t,k), g=N("g");
    g.setAttribute("opacity","0"); g.dataset.x=x; g.dataset.y=y; g.dataset.v=0;
    g.setAttribute("transform",`translate(${x} ${y})`);
    const halo=N("circle"); halo.setAttribute("r",10); halo.setAttribute("class","halo");
    const core=N("circle"); core.setAttribute("r",2.4); core.setAttribute("fill","#fff");
    const tx=N("text"); tx.setAttribute("x",9); tx.setAttribute("y",-7); tx.textContent=k;
    g.append(halo,core,tx); dots.appendChild(g); dotEls[k]=g;
  });
});

const MET=[
  {n:"CRR",  sub:"冠根比",           f:"CRR = JL / KL",      v:"crr",
   pts:["J","L","K"], segs:[["J","L"],["K","L"]]},
  {n:"ABLR", sub:"平均齒槽骨流失比", f:"ABLR = 1 − SK / LK", v:"ablr",
   pts:["S","K","L"], segs:[["S","K"],["L","K"]]},
  {n:"B-CRR",sub:"骨水平冠根比",     f:"B-CRR = JS / KS",    v:"bcrr",
   pts:["J","S","K"], segs:[["J","S"],["K","S"]]},
];
const beamEls={};
MET.forEach((m,mi)=>{
  beamEls[mi]=m.segs.map(([a,b])=>{
    const p1=at(T0,a), p2=at(T0,b), g=N("g");
    for(const cls of ["glow","beam","seg"]){
      const l=N("line");

      l.setAttribute("x2",p2[0]); l.setAttribute("y2",p2[1]);

[...boxes.children,...outls.children].forEach(el=>{
  const L=el.getTotalLength(); el.dataset.len=L;

/* 鏡頭：整張片 → 收到牙齒身上 */
const VB0=[0,0,787,555];
const VB1=(()=>{
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  TEETH.forEach(t=>t.poly.forEach(([x,y])=>{
    x0=Math.min(x0,x); y0=Math.min(y0,y); x1=Math.max(x1,x); y1=Math.max(y1,y);
  }));
  const pad=34;
  return [x0-pad,y0-pad,x1-x0+pad*2,y1-y0+pad*2];
})();
/* 鏡頭：不改 viewBox、不改元素寬度，只對 <g> 下 transform。
   改 viewBox 會讓三層遮罩每幀重新光柵化，改寬度還會觸發重排——
   那正是畫面一格一格跳的來源。transform 走合成層，不碰版面。 */
const CAM_S=Math.min(VB0[2]/VB1[2], VB0[3]/VB1[3]);
const C0=[VB0[2]/2, VB0[3]/2];
const C1=[VB1[0]+VB1[2]/2, VB1[1]+VB1[3]/2];
const cam=document.getElementById("cam"), camImg=document.getElementById("camImg");
let lastCam="";

const imFull=document.getElementById("imFull"), imBox=document.getElementById("imBox");
const mname=document.getElementById("mname"), msub=document.getElementById("msub"),
      mval=document.getElementById("mval"), mform=document.getElementById("mform");

function prog(el){
  const r=el.getBoundingClientRect(), span=r.height-innerHeight;
  return span<=0?0:clamp(-r.top/span,0,1);
}

function frame(t){

  /* 1 蛻皮 */
  [...boxes.children].forEach(el=>{
    el.style.strokeDashoffset=el.dataset.len*(1-ease(seg(t,.03,.11)));
    el.style.opacity=1-ease(seg(t,.32,.40));
  });
  [...outls.children].forEach(el=>{
    el.style.strokeDashoffset=el.dataset.len*(1-ease(seg(t,.21,.30)));
    el.style.opacity=1-.7*ease(seg(t,.46,.55));
  });
  const oF=1-ease(seg(t,.13,.20)), oB=1-ease(seg(t,.32,.40));
  imFull.style.opacity=oF; imFull.style.display=oF<.004?"none":"";
  imBox.style.opacity=oB;  imBox.style.display=oB<.004?"none":"";

  /* 2 鏡頭推近 */
  const z=ease(seg(t,.36,.46));
  const sc=1+(CAM_S-1)*z;
  const cx=C0[0]+(C1[0]-C0[0])*z, cy=C0[1]+(C1[1]-C0[1])*z;
  const tr=`translate(${(C0[0]-sc*cx).toFixed(2)} ${(C0[1]-sc*cy).toFixed(2)}) scale(${sc.toFixed(4)})`;
  if(tr!==lastCam){ cam.setAttribute("transform",tr); camImg.setAttribute("transform",tr); lastCam=tr; }
  const k=1/sc;
  sv.style.setProperty("--k",k);

  /* 3 特徵點依序亮起 */
  ORDER.forEach((grp,gi)=>{
    const a=.46+gi*.036, v=ease(seg(t,a,a+.026));
    grp.forEach(kk=>dotEls[kk].dataset.v=v);
  });
  [...axes.children].forEach(el=>el.style.opacity=.45*ease(seg(t,.68,.71)));

  /* 4 推到左邊，右邊講指標 */
  const push=ease(seg(t,.70,.755));
  sv.style.transform=`translateX(${-push*innerWidth*.22}px)`;
  mpanel.style.opacity=push;

  const inMet=t>=.76;
  /* 各占 8%：前段升起、後段停住，讓名詞留在畫面上久一點 */
  const i=t<.84?0:t<.92?1:2, m=MET[i];
  if(mname.textContent!==m.n){
    mname.textContent=m.n; msub.textContent=m.sub; mform.textContent=m.f;
    mval.textContent=T0[m.v].toFixed(4);
  }
  const local=i===0?seg(t,.76,.815):i===1?seg(t,.84,.895):seg(t,.92,.975);
  const lit=inMet?ease(local):0;
  Object.values(beamEls).flat().forEach(g=>{
    g.querySelector(".glow").style.opacity=0;
    g.querySelector(".beam").style.opacity=0;
    g.querySelector(".seg").style.opacity=0;
  });
  if(inMet) beamEls[i].forEach(g=>{
    g.querySelector(".glow").style.opacity=.42*lit;
    g.querySelector(".beam").style.opacity=.8*lit;
    g.querySelector(".seg").style.opacity=lit;
  });

  Object.entries(dotEls).forEach(([kk,el])=>{
    const v=+el.dataset.v, dim=inMet && !m.pts.includes(kk) ? .12 : 1;
    const op=(v*dim).toFixed(3);
    if(el.dataset.op!==op){ el.setAttribute("opacity",op); el.dataset.op=op; }
    const tr=`translate(${el.dataset.x} ${el.dataset.y}) scale(${((.6+.4*v)*k).toFixed(4)})`;
    if(el.dataset.tr!==tr){ el.setAttribute("transform",tr); el.dataset.tr=tr; }
  });

}

/* 目前這顆牙的數值；展開動畫會照著它從 0 長上來 */
const CUR={crr:0,ablr:0,bcrr:0,conf:0,risk:0,avg:{crr:0,ablr:0,bcrr:0}};
const RING_R=38, RING_C=2*Math.PI*RING_R;

function ringMarkup(){
  return `<circle cx="50" cy="50" r="${RING_R}" fill="none" stroke="#fff"
      stroke-opacity=".28" stroke-width="6"/>
    <circle class="arc" cx="50" cy="50" r="${RING_R}" fill="none" stroke="#fff"
      stroke-width="6" stroke-dasharray="${RING_C}" stroke-dashoffset="${RING_C}"
      transform="rotate(-90 50 50)"/>
    <text class="rv" x="50" y="50" text-anchor="middle" dominant-baseline="central"
      font-family="Archivo,sans-serif" font-weight="700" font-size="22" fill="#fff">0</text>`;
}
dConf.innerHTML=ringMarkup(); dRisk.innerHTML=ringMarkup();

function barChart(avg){
  const keys=["crr","ablr","bcrr"], names=["CRR","ABLR","B-CRR"];
  const X0=42, W=70, GAP=24, TOP=18, H=96;
  let h=`<rect class="frame" x="${X0-14}" y="${TOP}" width="${3*W+2*GAP+28}" height="${H}"
          fill="none" stroke="#fff" stroke-dasharray="5 5"/>`;
  keys.forEach((k,i)=>{
    const ratio=avg[k]/CEIL[k], hh=Math.min(ratio,1.4)*H;
    const col=ratio>1?"#E0564A":ratio>.7?"#E5A34F":"#5FD3A6";
    const x=X0+i*(W+GAP), y=TOP+H-hh;
    h+=`<rect class="bar" x="${x}" y="${y}" width="${W}" height="${hh}" fill="${col}"
          style="transform-box:fill-box;transform-origin:bottom"/>
        <text class="barv" x="${x+W/2}" y="${y-6}" text-anchor="middle" fill="#fff"
          font-family="IBM Plex Mono,monospace" font-size="11">0.000</text>
        <text class="barn" x="${x+W/2}" y="${TOP+H+18}" text-anchor="middle" fill="#fff"
          font-family="IBM Plex Mono,monospace" font-size="10"
          letter-spacing="1">${names[i]}</text>`;
  });
  document.getElementById("bars").innerHTML=h;
}

function showTooth(bi,ti){
  const b=BATCHES[bi], t=b.teeth[ti];
  shTitle.textContent=`${b.name}　${t.no}`;
  const cej=131.9, apex=336.5, alc=cej+(apex-cej)*clamp(t.ablr,0,.9);
  lAlc.setAttribute("y1",alc); lAlc.setAttribute("y2",alc);
  tAlc.setAttribute("y",alc+3);

  const n=b.teeth.length;
  for(const k of ["crr","ablr","bcrr"]) CUR.avg[k]=b.teeth.reduce((s,x)=>s+x[k],0)/n;
  CUR.crr=t.crr; CUR.ablr=t.ablr; CUR.bcrr=t.bcrr;
  CUR.conf=b.teeth.reduce((s,x)=>s+x.conf,0)/n;
  const worst=Math.max(...["crr","ablr","bcrr"].map(k=>CUR.avg[k]/CEIL[k]));
  CUR.risk=clamp((worst-.55)/1.05,0,1);
  barChart(CUR.avg);

  document.querySelectorAll(".kids button").forEach(x=>x.classList.remove("on"));
  document.querySelector(`.kids button[data-b="${bi}"][data-t="${ti}"]`)?.classList.add("on");
  paintSheet(sheetP);
}

/* ═════ 診斷書：滿版釘住之後，隨捲動一層層展開 ═════
   分成外框 → 標頭 → 批次逐列 → 牙齒描邊 → CEJ/ALC → 名詞逐列 →
   三個指標逐格數字上升 → 長條逐根長高 → 兩個圓環掃出來。
   全部由捲動位置決定，所以不可能提前跑完。 */
const sheetEl=document.getElementById("sheet"), sheetSec=document.getElementById("sheetScroll");
const toothOut=document.getElementById("toothOut");
const TOOTH_LEN=toothOut.getTotalLength();
toothOut.style.strokeDasharray=TOOTH_LEN;
const lvls=[...sheetEl.querySelectorAll(".lvl")];
const folds=[...sheetEl.querySelectorAll(".fold")];
const mcards=[...sheetEl.querySelectorAll(".mrow > div")];
const mvals=[vCRR,vABLR,vBCRR];
let sheetP=0;

const pop=x=>1-Math.pow(1-x,3);
function paintSheet(p){
  sheetP=p;
  /* 外框：釘住之後才彈開，帶一點回彈 */
  const f=pop(seg(p,.02,.16));
  sheetEl.style.opacity=(.10+.90*f).toFixed(3);
  sheetEl.style.transform=`scale(${(.90+.10*f+.012*Math.sin(f*Math.PI)).toFixed(4)})`;
  sheetEl.classList.toggle("done", p>.985);

  const set=(el,v,dy=18)=>{ el.style.opacity=v.toFixed(3);
    el.style.transform=`translateY(${((1-v)*dy).toFixed(1)}px)`; };

  set(document.querySelector(".sheet-hd"), pop(seg(p,.14,.22)), 14);
  folds.forEach((el,i)=>set(el, pop(seg(p,.20+i*.014,.26+i*.014)), 12));

  /* 牙齒：輪廓自己描出來 */
  const td=pop(seg(p,.30,.46));
  toothOut.style.strokeDashoffset=TOOTH_LEN*(1-td);
  toothOut.style.opacity=td>0?1:0;
  const lv=pop(seg(p,.44,.52));
  lvls.forEach(el=>el.style.opacity=lv.toFixed(3));


  /* 三個指標：逐格彈出並把數字跑上去 */
  mcards.forEach((el,i)=>{
    const v=pop(seg(p,.56+i*.045,.64+i*.045));
    set(el,v,22);
    mvals[i].textContent=(([CUR.crr,CUR.ablr,CUR.bcrr][i])*v).toFixed(4);
  });

  /* 長條圖 */
  const cf=pop(seg(p,.62,.70));
  const bars=[...document.querySelectorAll("#bars .bar")];
  const barv=[...document.querySelectorAll("#bars .barv")];
  const barn=[...document.querySelectorAll("#bars .barn")];
  document.querySelector("#bars .frame")?.setAttribute("opacity",cf);
  bars.forEach((r,i)=>{
    const v=pop(seg(p,.68+i*.055,.78+i*.055));
    r.style.transform=`scaleY(${v.toFixed(3)})`;
    barv[i].setAttribute("opacity",v.toFixed(3));
    barv[i].textContent=(CUR.avg[["crr","ablr","bcrr"][i]]*v).toFixed(3);
    barn[i].setAttribute("opacity",cf.toFixed(3));
  });

  /* 兩個圓環 */
  [[dConf,CUR.conf,.84],[dRisk,CUR.risk,.88]].forEach(([svg,val,a])=>{
    const v=pop(seg(p,a,a+.11));
    const arc=svg.querySelector(".arc"), tx=svg.querySelector(".rv");
    arc.style.strokeDashoffset=RING_C*(1-val*v);
    tx.setAttribute("opacity",v.toFixed(3));
    tx.textContent=Math.round(val*v*100);
  });
  [...document.querySelectorAll(".dial b")].forEach((el,i)=>
    el.style.opacity=pop(seg(p,.86+i*.04,.96+i*.04)).toFixed(3));
}

folders.addEventListener("click",e=>{
  const b=e.target.closest(".kids button"); if(!b) return;
  showTooth(+b.dataset.b, +b.dataset.t);
});
showTooth(0,0);

/* ═════ 準確度：捲動驅動的單向遞增 ═════
   自己佔 260svh，四個數字依序往上跑，最後一個約在 p=.82 收完，
   所以捲到這一屏站定時剛好結束。只記最大值，往回捲不會倒退。 */
const accSec=document.getElementById("accScroll");
const accB=[...document.querySelectorAll(".accgrid b")];
const accMax=accB.map(()=>0);
function accFrame(){
  const p=prog(accSec);
  accB.forEach((el,i)=>{
    const local=clamp((p-i*.10)/.52,0,1);
    const v=1-Math.pow(1-local,3);
    if(v<=accMax[i]) return;
    accMax[i]=v;
    el.textContent=(+el.dataset.to*v).toFixed(4);
    el.style.opacity=(.16+.84*v).toFixed(3);
    el.style.transform=`translateY(${((1-v)*22).toFixed(1)}px)`;
  });
}

goRun.onclick=()=>document.getElementById("act").scrollIntoView({behavior:"smooth"});

/* 直接把捲動值畫上去會跟著滾輪一格一格跳。改成每幀往目標值靠近一部分，
   停止捲動後自然收斂，看起來才連續。 */
const ACT=document.getElementById("act");
let cur=prog(ACT), running=false;
let curS=prog(sheetSec);
/* 只有靠近畫面的區段才算，三段同時跑會白白浪費一幀的預算 */
const near=el=>{ const r=el.getBoundingClientRect();
  return r.bottom>-innerHeight && r.top<innerHeight*2; };
function loop(){
  const target=prog(ACT), tS=prog(sheetSec);
  cur  += (target-cur)*.075;
  curS += (tS-curS)*.10;
  if(Math.abs(target-cur)<.0001) cur=target;
  if(Math.abs(tS-curS)<.0001) curS=tS;
  if(near(ACT)) frame(cur);
  if(near(sheetSec)) paintSheet(curS);
  if(near(accSec)) accFrame();
  running = (cur!==target)||(curS!==tS);
  if(running) requestAnimationFrame(loop);
}
function kick(){ if(!running){ running=true; requestAnimationFrame(loop); } }
addEventListener("scroll",kick,{passive:true});
addEventListener("resize",()=>{ cur=prog(ACT); curS=prog(sheetSec);
  frame(cur); paintSheet(curS); accFrame(); });
frame(cur); paintSheet(curS); accFrame();
</script>
